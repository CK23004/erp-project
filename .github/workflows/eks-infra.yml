# ── EKS Infrastructure Pipeline ───────────────────────────────────────────
# Mirrors: infra/backend/Jenkinsfile
# Runs on your LOCAL machine as a self-hosted GitHub Actions runner.
# Uses your locally installed Terraform, AWS CLI — no tool setup needed.
#
# Self-hosted runner label: self-hosted
# To register your machine: GitHub repo → Settings → Actions → Runners → New self-hosted runner
#
# GitHub Secrets required (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

name: EKS Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, stage, prod]
      action:
        description: "apply = create/update  |  destroy = tear down"
        required: true
        type: choice
        options: [apply, destroy]

env:
  AWS_REGION: us-east-1
  TF_DIR:     infra/backend/terraform/envs/${{ github.event.inputs.environment }}

jobs:
  terraform:
    name: "Terraform ${{ github.event.inputs.action }} — EKS ${{ github.event.inputs.environment }}"
    # Uses your local machine — all tools (terraform, aws cli) must be installed
    runs-on: self-hosted
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:

      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      # ── AWS credentials via env vars ──────────────────────────────────────
      # Uses the secrets stored in GitHub — injected into the runner process
      - name: Set AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      # ── Terraform Init ────────────────────────────────────────────────────
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      # ── Terraform Plan ────────────────────────────────────────────────────
      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan.binary
          else
            terraform plan -input=false -out=tfplan.binary
          fi
          terraform show -no-color tfplan.binary > tfplan.txt
          echo "=== PLAN OUTPUT ===" && cat tfplan.txt

      # ── Upload plan for review ────────────────────────────────────────────
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-eks-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: ${{ env.TF_DIR }}/tfplan.txt
          retention-days: 7

      # ── Apply / Destroy ───────────────────────────────────────────────────
      # For prod: configure GitHub Environment with Required Reviewers —
      # the job pauses here until a reviewer approves in the GitHub UI.
      - name: Terraform ${{ github.event.inputs.action }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan.binary

      # ── Show outputs (apply only) ─────────────────────────────────────────
      - name: Terraform Output
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: terraform output

      # ── Cleanup ───────────────────────────────────────────────────────────
      - name: Cleanup plan files
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: rm -f tfplan.binary tfplan.txt
