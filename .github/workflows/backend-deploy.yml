# ── Backend Application Deploy Pipeline ───────────────────────────────────
# Mirrors: smartbiz-erp/Jenkinsfile.backend
# Flow: Test → SonarQube → Build JARs → Docker Build+Push ECR → Deploy EKS → Verify
#
# GitHub Secrets required (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID       — IAM user access key
#   AWS_SECRET_ACCESS_KEY   — IAM user secret key
#   SONAR_TOKEN             — SonarQube user token
#   JWT_SECRET              — JWT signing key (base64 256-bit)
#   MONGO_URI_USERS         — Atlas/local MongoDB URI for smartbiz_users
#   MONGO_URI_INVENTORY     — Atlas/local MongoDB URI for smartbiz_inventory
#   MONGO_URI_SALES         — Atlas/local MongoDB URI for smartbiz_sales
#
# GitHub Environments (Settings → Environments):
#   prod — add Required Reviewers for the approval gate

name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target EKS cluster"
        required: true
        type: choice
        options: [dev, stage, prod]
      skip_tests:
        description: "Skip unit tests (emergencies only)"
        required: false
        type: boolean
        default: false
      skip_sonar:
        description: "Skip SonarQube analysis"
        required: false
        type: boolean
        default: false

env:
  AWS_REGION:    us-east-1
  K8S_NAMESPACE: smartbiz
  IMAGE_TAG:     ${{ github.event.inputs.environment }}-${{ github.run_number }}
  SONAR_HOST:    http://localhost:9000   # change to your SonarQube URL

jobs:

  # ── Job 1: Test (parallel services) ──────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    strategy:
      matrix:
        service: [user-service, inventory-service, sales-service]
      fail-fast: false   # run all three even if one fails

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests — ${{ matrix.service }}
        run: |
          cd smartbiz-erp/backend/${{ matrix.service }}
          mvn clean verify -B -q \
            -Dspring.data.mongodb.database=smartbiz_${{ matrix.service }}_test

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: smartbiz-erp/backend/${{ matrix.service }}/target/surefire-reports/*.xml
          retention-days: 7

  # ── Job 2: SonarQube Analysis ─────────────────────────────────────────────
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event.inputs.skip_sonar != 'true' && always() && needs.test.result != 'failure' }}
    strategy:
      matrix:
        service: [user-service, inventory-service, sales-service]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0   # full history needed for accurate SonarQube blame

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Run verify first to generate JaCoCo coverage report for SonarQube
      - name: Build with coverage — ${{ matrix.service }}
        run: |
          cd smartbiz-erp/backend/${{ matrix.service }}
          mvn clean verify -B -q \
            -Dspring.data.mongodb.database=smartbiz_test

      - name: SonarQube scan — ${{ matrix.service }}
        run: |
          cd smartbiz-erp/backend/${{ matrix.service }}
          mvn sonar:sonar -B -q \
            -Dsonar.host.url=${{ env.SONAR_HOST }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=smartbiz-erp \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java

      # Poll SonarQube quality gate via REST API — no webhook needed
      - name: Check quality gate
        run: |
          echo "Waiting for SonarQube analysis to complete..."
          STATUS=""
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
              "${{ env.SONAR_HOST }}/api/qualitygates/project_status?projectKey=smartbiz-erp" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['projectStatus']['status'])" 2>/dev/null || echo "PENDING")
            echo "Quality gate status: $STATUS"
            if [ "$STATUS" = "OK" ] || [ "$STATUS" = "ERROR" ]; then
              break
            fi
          done
          if [ "$STATUS" = "ERROR" ]; then
            echo "❌ Quality gate FAILED"
            exit 1
          fi
          echo "✅ Quality gate PASSED (or timed out — check SonarQube UI)"

  # ── Job 3: Build & Push Docker images to ECR ──────────────────────────────
  build-push:
    name: Build & Push ECR
    runs-on: ubuntu-latest
    needs: [test, sonar]
    if: always() && needs.test.result != 'failure' && needs.sonar.result != 'failure'
    outputs:
      ecr_registry: ${{ steps.ecr.outputs.registry }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build all three JARs
      - name: Build JARs
        run: |
          for svc in user-service inventory-service sales-service; do
            echo "Building JAR: $svc"
            cd smartbiz-erp/backend/$svc
            mvn package -DskipTests -B -q
            cd ../../..
          done

      # Build and push Docker images in parallel using matrix isn't possible here
      # so we do them sequentially — still fast since builds are independent
      - name: Build & Push — user-service
        run: |
          cd smartbiz-erp/backend/user-service
          docker build -t ${{ steps.ecr.outputs.registry }}/smartbiz-user-service:${{ env.IMAGE_TAG }} .
          docker push ${{ steps.ecr.outputs.registry }}/smartbiz-user-service:${{ env.IMAGE_TAG }}
          docker tag  ${{ steps.ecr.outputs.registry }}/smartbiz-user-service:${{ env.IMAGE_TAG }} \
                      ${{ steps.ecr.outputs.registry }}/smartbiz-user-service:${{ github.event.inputs.environment }}-latest
          docker push ${{ steps.ecr.outputs.registry }}/smartbiz-user-service:${{ github.event.inputs.environment }}-latest

      - name: Build & Push — inventory-service
        run: |
          cd smartbiz-erp/backend/inventory-service
          docker build -t ${{ steps.ecr.outputs.registry }}/smartbiz-inventory-service:${{ env.IMAGE_TAG }} .
          docker push ${{ steps.ecr.outputs.registry }}/smartbiz-inventory-service:${{ env.IMAGE_TAG }}
          docker tag  ${{ steps.ecr.outputs.registry }}/smartbiz-inventory-service:${{ env.IMAGE_TAG }} \
                      ${{ steps.ecr.outputs.registry }}/smartbiz-inventory-service:${{ github.event.inputs.environment }}-latest
          docker push ${{ steps.ecr.outputs.registry }}/smartbiz-inventory-service:${{ github.event.inputs.environment }}-latest

      - name: Build & Push — sales-service
        run: |
          cd smartbiz-erp/backend/sales-service
          docker build -t ${{ steps.ecr.outputs.registry }}/smartbiz-sales-service:${{ env.IMAGE_TAG }} .
          docker push ${{ steps.ecr.outputs.registry }}/smartbiz-sales-service:${{ env.IMAGE_TAG }}
          docker tag  ${{ steps.ecr.outputs.registry }}/smartbiz-sales-service:${{ env.IMAGE_TAG }} \
                      ${{ steps.ecr.outputs.registry }}/smartbiz-sales-service:${{ github.event.inputs.environment }}-latest
          docker push ${{ steps.ecr.outputs.registry }}/smartbiz-sales-service:${{ github.event.inputs.environment }}-latest

  # ── Job 4: Deploy to EKS ──────────────────────────────────────────────────
  # The 'prod' environment requires manual approval via GitHub Environments.
  # Set up: Settings → Environments → prod → Required reviewers
  deploy:
    name: Deploy to EKS (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: ${{ github.event.inputs.environment }}   # triggers approval gate for prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Get ECR registry
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name eks-${{ github.event.inputs.environment }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply namespace
        run: kubectl apply -f smartbiz-erp/k8s/namespace.yaml

      - name: Create / update K8s secrets
        run: |
          kubectl create secret generic smartbiz-secrets \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=MONGO_URI_USERS="${{ secrets.MONGO_URI_USERS }}" \
            --from-literal=MONGO_URI_INVENTORY="${{ secrets.MONGO_URI_INVENTORY }}" \
            --from-literal=MONGO_URI_SALES="${{ secrets.MONGO_URI_SALES }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy services
        run: |
          ECR="${{ steps.ecr.outputs.registry }}"
          TAG="${{ env.IMAGE_TAG }}"
          NS="${{ env.K8S_NAMESPACE }}"

          sed "s|USER_SERVICE_IMAGE|${ECR}/smartbiz-user-service:${TAG}|g" \
            smartbiz-erp/k8s/user-service/deployment.yaml | kubectl apply -n $NS -f -

          sed "s|INVENTORY_SERVICE_IMAGE|${ECR}/smartbiz-inventory-service:${TAG}|g" \
            smartbiz-erp/k8s/inventory-service/deployment.yaml | kubectl apply -n $NS -f -

          sed "s|SALES_SERVICE_IMAGE|${ECR}/smartbiz-sales-service:${TAG}|g" \
            smartbiz-erp/k8s/sales-service/deployment.yaml | kubectl apply -n $NS -f -

          kubectl apply -n $NS -f smartbiz-erp/k8s/user-service/service.yaml
          kubectl apply -n $NS -f smartbiz-erp/k8s/inventory-service/service.yaml
          kubectl apply -n $NS -f smartbiz-erp/k8s/sales-service/service.yaml
          kubectl apply -n $NS -f smartbiz-erp/k8s/ingress.yaml

      - name: Verify rollout
        run: |
          NS="${{ env.K8S_NAMESPACE }}"
          kubectl rollout status deployment/user-service      -n $NS --timeout=180s
          kubectl rollout status deployment/inventory-service -n $NS --timeout=180s
          kubectl rollout status deployment/sales-service     -n $NS --timeout=180s
          echo "=== Pods ==="
          kubectl get pods -n $NS
          echo "=== Ingress ==="
          kubectl get ingress -n $NS
