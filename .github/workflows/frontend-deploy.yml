# ── Frontend Application Deploy Pipeline ──────────────────────────────────
# Mirrors: smartbiz-erp/Jenkinsfile.frontend
# Runs on your LOCAL machine as a self-hosted runner.
# Uses locally installed: Node.js 20+, npm, AWS CLI
#
# Flow: Install → Lint → Vite Build → S3 Sync → CloudFront Invalidation
#
# GitHub Secrets required:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

name: Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, stage, prod]
      api_base_url:
        description: "Backend API base URL (ALB DNS or CloudFront URL)"
        required: true
        default: "https://api.example.com"
      invalidate_cdn:
        description: "Invalidate CloudFront cache after S3 sync"
        type: boolean
        default: true

env:
  AWS_REGION:   us-east-1
  S3_BUCKET:    smartbiz-frontend-${{ github.event.inputs.environment }}-200774432801
  FRONTEND_DIR: smartbiz-erp/frontend

jobs:

  # ── Job 1: Build ──────────────────────────────────────────────────────
  build:
    name: Install, Lint & Vite Build
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Show tool versions
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install --silent

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint --if-present || true

      - name: Vite Build
        working-directory: ${{ env.FRONTEND_DIR }}
        # API URL is baked into the JS bundle at build time
        env:
          VITE_USER_API:      ${{ github.event.inputs.api_base_url }}
          VITE_INVENTORY_API: ${{ github.event.inputs.api_base_url }}
          VITE_SALES_API:     ${{ github.event.inputs.api_base_url }}
        run: |
          npm run build
          echo "=== Build output ===" && ls -lh dist/ && du -sh dist/

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_number }}
          path: ${{ env.FRONTEND_DIR }}/dist
          retention-days: 3

  # ── Job 2: Deploy ─────────────────────────────────────────────────────
  # prod environment triggers GitHub Environments approval gate.
  # Set up: Settings → Environments → prod → Required reviewers
  deploy:
    name: Deploy to S3 (${{ github.event.inputs.environment }})
    runs-on: self-hosted
    needs: build
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.run_number }}
          path: dist

      - name: Set AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: S3 Sync — assets (long cache, 1 year)
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: S3 Sync — HTML (no cache)
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"
          echo "✅ Synced to s3://${{ env.S3_BUCKET }}/"

      - name: CloudFront Invalidation
        if: github.event.inputs.invalidate_cdn == 'true'
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[0].DomainName=='${{ env.S3_BUCKET }}.s3.amazonaws.com'].Id | [0]" \
            --output text)

          if [ "$DIST_ID" = "None" ] || [ -z "$DIST_ID" ]; then
            echo "⚠️  No CloudFront distribution found for ${{ env.S3_BUCKET }}. Skipping."
          else
            echo "Invalidating: $DIST_ID"
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"
            echo "✅ Cache invalidation created"
          fi

      - name: Job summary
        run: |
          echo "### ✅ Frontend Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ github.event.inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| S3 Bucket | s3://${{ env.S3_BUCKET }}/ |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ github.event.inputs.api_base_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
