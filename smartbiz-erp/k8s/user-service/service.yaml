apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  # ClusterIP keeps the service internal — traffic comes in via the ALB Ingress
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      protocol: TCP
      port: 80          # service port (used by ingress)
      targetPort: 8081  # container port
