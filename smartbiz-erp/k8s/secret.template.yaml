# ── Kubernetes Secret Template ────────────────────────────────────────────
# DO NOT commit real values. This is a template only.
#
# Before deploying, create the real secret:
#
#   kubectl create secret generic smartbiz-secrets -n smartbiz \
#     --from-literal=JWT_SECRET="<base64-encoded-256-bit-key>" \
#     --from-literal=MONGO_URI_USERS="mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/smartbiz_users?retryWrites=true&w=majority" \
#     --from-literal=MONGO_URI_INVENTORY="mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/smartbiz_inventory?retryWrites=true&w=majority" \
#     --from-literal=MONGO_URI_SALES="mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/smartbiz_sales?retryWrites=true&w=majority"
#
# For local MongoDB on EKS (not Atlas), use:
#   --from-literal=MONGO_URI_USERS="mongodb://mongo-service:27017/smartbiz_users"
#
# The Jenkins pipeline creates/updates this secret automatically
# using credentials stored in Jenkins Credential Manager.
apiVersion: v1
kind: Secret
metadata:
  name: smartbiz-secrets
  namespace: smartbiz
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_REAL_SECRET"
  MONGO_URI_USERS: "REPLACE_WITH_ATLAS_OR_LOCAL_URI"
  MONGO_URI_INVENTORY: "REPLACE_WITH_ATLAS_OR_LOCAL_URI"
  MONGO_URI_SALES: "REPLACE_WITH_ATLAS_OR_LOCAL_URI"
