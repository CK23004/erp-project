apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-service
  labels:
    app: sales-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sales-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sales-service
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sales-service
      containers:
        - name: sales-service
          image: SALES_SERVICE_IMAGE   # replaced by Jenkins
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: smartbiz-secrets
                  key: MONGO_URI_SALES
            - name: SPRING_DATA_MONGODB_DATABASE
              value: "smartbiz_sales"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartbiz-secrets
                  key: JWT_SECRET
            - name: SERVER_PORT
              value: "8083"
            # Sales service calls inventory — use the K8s internal DNS name
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
