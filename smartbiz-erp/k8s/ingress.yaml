# ── ALB Ingress ────────────────────────────────────────────────────────────
# Two modes — switch by commenting/uncommenting the relevant sections.
#
# ── MODE A: No custom domain (default) ────────────────────────────────────
#   Backend URL: http://<alb-dns>.us-east-1.elb.amazonaws.com
#   No ACM cert, no Route53, no host rule.
#   Use this for quick deploys or when you don't have a domain.
#   To use: keep the spec.rules section WITHOUT a host field (see below).
#
# ── MODE B: Custom domain (api.example.com) ───────────────────────────────
#   Backend URL: https://api.example.com
#   Requires: ACM cert ARN, Route53 A alias record (manual one-time setup).
#   To use: uncomment the certificate-arn, listen-ports, ssl-redirect
#           annotations, and add host: api.example.com to spec.rules.
#
# Path routing (same for both modes):
#   /api/auth/*         → user-service
#   /api/users/*        → user-service
#   /api/employees/*    → user-service
#   /api/departments/*  → user-service
#   /api/products/*     → inventory-service
#   /api/categories/*   → inventory-service
#   /api/suppliers/*    → inventory-service
#   /api/purchases/*    → inventory-service
#   /api/stock/*        → inventory-service
#   /api/customers/*    → sales-service
#   /api/orders/*       → sales-service
#   /api/invoices/*     → sales-service
#   /api/payments/*     → sales-service
#
# Prerequisite: AWS Load Balancer Controller must be installed on the cluster.
#   helm repo add eks https://aws.github.io/eks-charts
#   helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     -n kube-system --set clusterName=<cluster-name>

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartbiz-ingress
  namespace: smartbiz
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # Health check — all services expose /actuator/health
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    # Security — drop malformed headers
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true

    # ── MODE A: HTTP only (no domain, no cert) — ACTIVE BY DEFAULT ────────
    # ALB listens on port 80 only. Access backend via:
    #   http://<alb-dns>.us-east-1.elb.amazonaws.com/api/...
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    # ── MODE B: HTTPS + custom domain — uncomment to enable ───────────────
    # 1. Replace REPLACE_WITH_ACM_CERT_ARN with your cert ARN
    # 2. Uncomment the three lines below
    # 3. Add "host: api.example.com" in spec.rules (see commented block)
    # 4. Create Route53 A alias: api.example.com → ALB DNS name
    #
    # alb.ingress.kubernetes.io/certificate-arn: "REPLACE_WITH_ACM_CERT_ARN"
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: "443"

spec:
  rules:
    # ── MODE A: No host rule — ALB accepts requests on any hostname ────────
    # Access via the raw ALB DNS name on port 80.
    # Run: kubectl get ingress smartbiz-ingress -n smartbiz
    # to get the ALB ADDRESS after applying.
    - http:
        paths:

    # ── MODE B: Custom domain — replace the rule above with this ──────────
    # - host: api.example.com
    #   http:
    #     paths:

          # ── User Service ────────────────────────────────────────────────
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /api/employees
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /api/departments
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80

          # ── Inventory Service ───────────────────────────────────────────
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 80
          - path: /api/categories
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 80
          - path: /api/suppliers
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 80
          - path: /api/purchases
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 80
          - path: /api/stock
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 80

          # ── Sales Service ───────────────────────────────────────────────
          - path: /api/customers
            pathType: Prefix
            backend:
              service:
                name: sales-service
                port:
                  number: 80
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: sales-service
                port:
                  number: 80
          - path: /api/invoices
            pathType: Prefix
            backend:
              service:
                name: sales-service
                port:
                  number: 80
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: sales-service
                port:
                  number: 80
