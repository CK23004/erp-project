server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly; fall back to index.html for all routes.
    # This is required for React Router — without it, a hard refresh on
    # /dashboard would return a 404 because Nginx looks for a file at
    # that path, which doesn't exist (Vite outputs only index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Vite adds content hashes to filenames
    # so old files are never served after a new build.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access logs for health checks to reduce noise
    location /health {
        access_log off;
        return 200 "ok";
    }
}
