# ── Test configuration ────────────────────────────────────────────────────
# Overrides main application.properties for the test context.
# Embedded MongoDB (flapdoodle) is auto-configured — no URI needed.
spring.data.mongodb.database=smartbiz_users_test

# Valid 256-bit base64 key for JWT tests
jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3Itc21hcnRiaXotdW5pdC10ZXN0czEyMw==
jwt.expiration.ms=86400000

# Disable actuator auto-config noise in test logs
management.endpoints.web.exposure.include=health
logging.level.root=WARN
logging.level.com.smartbiz=INFO
