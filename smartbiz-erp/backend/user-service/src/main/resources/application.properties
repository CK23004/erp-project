# ── Server ────────────────────────────────────────────────────────────────
server.port=8081

# ── MongoDB ───────────────────────────────────────────────────────────────
# Local / Docker default — overridden by SPRING_DATA_MONGODB_URI env var.
#
# ── MongoDB Atlas (cloud) ─────────────────────────────────────────────────
# To use Atlas instead of a local MongoDB, set the environment variable:
#   SPRING_DATA_MONGODB_URI=mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/smartbiz_users?retryWrites=true&w=majority
#
# In Jenkins / Kubernetes: store the URI as a secret and inject it as the
# SPRING_DATA_MONGODB_URI environment variable. Never hardcode credentials.
#
# Atlas free tier (M0) is sufficient for dev/stage. Use M10+ for prod.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/smartbiz_users}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:smartbiz_users}

# ── JWT ───────────────────────────────────────────────────────────────────
# Override jwt.secret with a strong random value in production via env var:
# JWT_SECRET=<your-256-bit-base64-key>
jwt.secret=${JWT_SECRET:c21hcnRiaXotZXJwLXVzZXItc2VydmljZS1zZWNyZXQta2V5LTI1NmJpdHMhISE=}
jwt.expiration.ms=86400000

# ── App ───────────────────────────────────────────────────────────────────
spring.application.name=user-service
logging.level.com.smartbiz=DEBUG

# ── Actuator ──────────────────────────────────────────────────────────────
# Expose only the health endpoint — used by Docker healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
