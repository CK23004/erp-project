server.port=8082

# ── MongoDB ───────────────────────────────────────────────────────────────
# Local / Docker default — overridden by SPRING_DATA_MONGODB_URI env var.
#
# ── MongoDB Atlas (cloud) ─────────────────────────────────────────────────
# Set this env var to switch to Atlas:
#   SPRING_DATA_MONGODB_URI=mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/smartbiz_inventory?retryWrites=true&w=majority
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/smartbiz_inventory}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:smartbiz_inventory}
jwt.secret=${JWT_SECRET:c21hcnRiaXotZXJwLXVzZXItc2VydmljZS1zZWNyZXQta2V5LTI1NmJpdHMhISE=}
jwt.expiration.ms=86400000
spring.application.name=inventory-service
logging.level.com.smartbiz=DEBUG

# ── Actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
